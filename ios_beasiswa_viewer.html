<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progress Beasiswa Anak PTK</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(255, 255, 255, 0.8);
      --text-main: #1c1c1e;
      --text-muted: #8e8e93;
      --accent-blue: #007aff;
      --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      margin: 0;
      padding: 20px;
      color: var(--text-main);
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .header-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 24px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }

    .header-card h1 {
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 6px 0;
      letter-spacing: -0.5px;
    }

    .header-card .author {
      font-size: 14px;
      color: var(--accent-blue);
      font-weight: 500;
      margin-bottom: 12px;
    }

    .badge-update {
      display: inline-block;
      background: rgba(255, 255, 255, 0.8);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .item-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      margin-bottom: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease;
    }

    .card-header {
      background: rgba(255, 255, 255, 0.4);
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.5);
    }

    .card-header.highlight {
      background: rgba(255, 243, 176, 0.5);
    }

    .card-header .no-label {
      font-weight: 600;
      color: var(--accent-blue);
      font-size: 15px;
    }

    .card-header .ptk-name {
      font-weight: 700;
      color: var(--accent-blue);
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: -0.3px;
    }

    .card-body {
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .row-info {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
    }

    .row-info .label {
      color: var(--text-muted);
    }

    .row-info .value {
      font-weight: 600;
      color: var(--text-main);
      text-align: right;
    }

    .loading {
      text-align: center;
      color: var(--text-muted);
      padding: 40px;
      font-size: 14px;
    }
  </style>
</head>

    window.onload = function() {
      var now = new Date();
      var timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }).toLowerCase();
      var dateString = now.toLocaleDateString('en-GB'); 
      document.getElementById('update-time').innerText = "Update: " + timeString + " " + dateString;

      renderData(dataBeasiswa);
    };

    function renderData(data) {
      var container = document.getElementById('card-container');
      container.innerHTML = "";

      if (data.length === 0) {
        container.innerHTML = "<div class='loading'>Tidak ada data ditemukan.</div>";
        return;
      }

      data.forEach(function(item, index) {
        var isHighlight = (index === 1 || index === 2) ? "highlight" : "";

        var card = document.createElement('div');
        card.className = "item-card";
        
        card.innerHTML = `
          <div class="card-header ${isHighlight}">
            <span class="no-label">No. ${item.no}</span>
            <span class="ptk-name">${item.namaPTK}</span>
          </div>
          <div class="card-body">
            <div class="row-info">
              <span class="label">Nama Santri</span>
              <span class="value">${item.namaMurid}</span>
            </div>
            <div class="row-info">
              <span class="label">Kelas</span>
              <span class="value">${item.kelas}</span>
            </div>
            <div class="row-info">
              <span class="label">Lembaga</span>
              <span class="value">${item.lembaga}</span>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
