<script>
    window.onload = function() {
      // Mengatur waktu update otomatis
      var now = new Date();
      var timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }).toLowerCase();
      var dateString = now.toLocaleDateString('en-GB'); 
      document.getElementById('update-time').innerText = "Update: " + timeString + " " + dateString;

      // Masukkan URL Web App Google Apps Script Anda di dalam tanda kutip di bawah ini:
      var webAppUrl = "https://script.google.com/macros/s/AKfycbwn2YwGu9HWFYMUmMRRWib2fNim6BhuMqhCAnIAa-khpqcyMiGQ40oNmMBBX-4xus34RA/exec";

      fetch(webAppUrl)
        .then(response => response.json())
        .then(data => {
          renderData(data);
        })
        .catch(error => {
          console.error('Error:', error);
          document.getElementById('card-container').innerHTML = "<div class='loading'>Gagal memuat data dari spreadsheet.</div>";
        });
    };

    function renderData(data) {
      var container = document.getElementById('card-container');
      container.innerHTML = "";

      if (data.length === 0) {
        container.innerHTML = "<div class='loading'>Tidak ada data ditemukan.</div>";
        return;
      }

      data.forEach(function(item, index) {
        var isHighlight = (index === 1 || index === 2) ? "highlight" : "";

        var card = document.createElement('div');
        card.className = "item-card";
        
        card.innerHTML = `
          <div class="card-header ${isHighlight}">
            <span class="no-label">No. ${item.no}</span>
            <span class="ptk-name">${item.namaPTK}</span>
          </div>
          <div class="card-body">
            <div class="row-info">
              <span class="label">Nama Santri</span>
              <span class="value">${item.namaMurid}</span>
            </div>
            <div class="row-info">
              <span class="label">Kelas</span>
              <span class="value">${item.kelas}</span>
            </div>
            <div class="row-info">
              <span class="label">Lembaga</span>
              <span class="value">${item.lembaga}</span>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }
  </script>
